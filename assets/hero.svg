<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Illustration of homes on the west Fort Worth prairie at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF6E3"/>
      <stop offset=".55" stop-color="#F6E3C5"/>
      <stop offset="1" stop-color="#EAC998"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FB6A2"/><stop offset="1" stop-color="#7E9C86"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54785F"/><stop offset="1" stop-color="#3E6350"/>
    </linearGradient>
    <linearGradient id="hillC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F5545"/><stop offset="1" stop-color="#24463A"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="560" fill="url(#sky)"/>
  <circle cx="1080" cy="180" r="86" fill="#E8A54B" opacity=".9"/>
  <circle cx="1080" cy="180" r="120" fill="#E8A54B" opacity=".18"/>
  <g opacity=".5" stroke="#D9A566" stroke-width="3" fill="none">
    <path d="M60 120 q40 -18 80 0"/><path d="M180 90 q30 -14 60 0"/><path d="M330 150 q36 -16 72 0"/>
  </g>
  <path d="M0 340 Q 240 280 480 330 T 960 320 T 1440 300 V560 H0 Z" fill="url(#hillA)"/>
  <path d="M0 400 Q 300 340 620 396 T 1200 380 T 1440 372 V560 H0 Z" fill="url(#hillB)"/>
  <!-- windmill -->
  <g transform="translate(210,262)" stroke="#24463A" stroke-width="5" fill="none" opacity=".85">
    <line x1="0" y1="0" x2="0" y2="96"/><line x1="-16" y1="96" x2="16" y2="96"/>
    <g stroke-width="4">
      <line x1="0" y1="0" x2="0" y2="-34"/><line x1="0" y1="0" x2="30" y2="17"/><line x1="0" y1="0" x2="-30" y2="17"/>
    </g><circle cx="0" cy="0" r="5" fill="#24463A"/>
  </g>
  <!-- house cluster -->
  <g transform="translate(760,330)">
    <g fill="#F4F2EC" stroke="#24463A" stroke-width="5">
      <path d="M0 60 V16 L48 -18 L96 16 V60 Z"/>
      <path d="M96 60 V24 L150 -6 L204 24 V60 Z"/>
      <path d="M204 60 V30 L242 6 L280 30 V60 Z"/>
    </g>
    <g fill="#E8A54B">
      <rect x="30" y="26" width="18" height="18" rx="2"/>
      <rect x="128" y="30" width="18" height="18" rx="2"/>
      <rect x="228" y="34" width="14" height="14" rx="2"/>
    </g>
    <rect x="60" y="34" width="16" height="26" fill="#24463A" rx="2"/>
  </g>
  <path d="M0 470 Q 360 430 760 462 T 1440 452 V560 H0 Z" fill="url(#hillC)"/>
  <!-- fence -->
  <g stroke="#F4F2EC" stroke-width="4" opacity=".55">
    <line x1="80" y1="492" x2="80" y2="522"/><line x1="140" y1="496" x2="140" y2="526"/>
    <line x1="200" y1="500" x2="200" y2="530"/><line x1="60" y1="504" x2="220" y2="512"/>
  </g>
  <g fill="#F4F2EC" opacity=".8">
    <circle cx="1250" cy="500" r="4"/><circle cx="1290" cy="492" r="3"/><circle cx="1330" cy="502" r="3.5"/>
  </g>
</svg>
