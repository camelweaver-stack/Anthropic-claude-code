# Netlify configuration for pcsoahu.com
# Static publisher site — no compile step. The deployable web root is `site/`,
# produced by the generator in `gen/` and verified by `gen/gate.py`.
# Never hand-edit site/: change content in gen/, then rebuild + re-gate.

[build]
  publish = "site"
  # No build step: the committed site/ is the gate-verified output.
  # (Rebuild locally with: cd gen && python3 build.py && python3 gate.py)
  command = ""

# Serverless functions (the /ask/ concierge). Requires env var ANTHROPIC_API_KEY
# set in the Netlify project before /ask/ returns live answers; until then the
# function degrades gracefully to an "offline" message (no broken UX).
[functions]
  directory = "netlify/functions"

# Canonical host is the apex (every <link rel="canonical"> in the build is https://pcsoahu.com).
# Redirect www -> apex, 301.
[[redirects]]
  from = "https://www.pcsoahu.com/*"
  to = "https://pcsoahu.com/:splat"
  status = 301
  force = true

# Netlify serves site/404.html for not-found routes automatically (by filename).

# Security + performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long-lived caching for the stylesheet (safe: refreshed via redeploys)
[[headers]]
  for = "/assets/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"
