# Netlify configuration for westfwliving.com
# Static site — no compile step; publish the repository root as-is.
# The build command only pings IndexNow after each deploy (fail-safe: `|| true`
# guarantees a ping error can never fail the deploy).

[build]
  publish = "."
  # `timeout 30` is a hard cap so a hung ping can never stall the build; `|| true` so a ping error never fails it.
  command = "timeout 30 node scripts/ping-indexnow.js || true"

[build.environment]
  # Node 20 for a stable global fetch() in the ping script.
  NODE_VERSION = "20"

# Security + performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long-lived caching for the stylesheet (safe: content-hashed via redeploys)
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"
