# Netlify configuration for westfwliving.com
# Static site — no compile step; publish the repository root as-is.
# The build command FIRST validates the deployable HTML against
# scripts/prohibited-content.json (placeholder/editorial/simulated-firsthand
# strings) and FAILS the deploy on any hit — this runs in Netlify's build, so
# it cannot be skipped by deploying without the local gates. Only then does it
# ping IndexNow (fail-safe: `|| true` so a ping error can never fail a deploy).

[build]
  publish = "."
  command = "node scripts/validate-production.js && (timeout 30 node scripts/ping-indexnow.js || true)"

[build.environment]
  # Node 20 for a stable global fetch() in the ping script.
  NODE_VERSION = "20"

# Security + performance headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # CSP starts in Report-Only: the site uses inline scripts (UTM capture,
    # chat widget, GA4 once wired), so 'unsafe-inline' is required until those
    # move to nonces. Watch reports for a week, then promote to enforced
    # Content-Security-Policy.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://formsubmit.co; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; form-action 'self' https://formsubmit.co; frame-ancestors 'self'"

# Long-lived caching for the stylesheet (safe: content-hashed via redeploys)
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/thanks.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/es/gracias.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/tv.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/poster.html"
  [headers.values]
    X-Robots-Tag = "noindex"
